eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8080
  servlet:
    context-path: /ecommerce

spring:
  application:
    name: order-service
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: localhost
      port: 6379
      password: "SecureRedisPassword123!"
      timeout: 2000ms
  datasource:
    url: "jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&rewriteBatchedStatements=true&useServerPrepStmts=true&characterEncoding=UTF-8"
    username: root
    password: root
  jpa:
    hibernate:
     ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

jwt:
  signerKey: "HWLeikcLYiycqMYYdcKG165sSqtMPYEigRLBhqryqR8+N1cvcgDz/O7oebcEcOKGCU+Kp1ZoZXREWd9tYRWroA=="
  valid-duration: 3600 # 1 hour (3600 seconds)
  refreshable-duration: 604800 # 7 days (604800 seconds)

