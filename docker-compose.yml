services:
  vti-keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: vti-keycloak
    restart: unless-stopped
    environment:
      KC_DB: mysql
      # Kết nối trực tiếp vào container mysql-8.0.46 của bạn qua cổng 3306 của máy host
      KC_DB_URL_HOST: host.docker.internal
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: start-dev
    ports:
      # Map cổng ngoài 8180 để không đụng độ với order-service (port 8080)
      - "8180:8080"

  zookeeper:
    container_name: mpm-handover-zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    container_name: mpm-handover-kafka
    image: confluentinc/cp-kafka:7.4.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-mpm-handover-10
    restart: unless-stopped
    ports:
      # Đổi cổng ngoài từ 8081 sang 8085 để không bị xung đột với product-service (port 8081)
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
      # Bật xác thực cơ bản cho Web UI
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "admin"
      SPRING_SECURITY_USER_PASSWORD: "ChangeThisPassword123!"

  redis:
    container_name: mpm-handover-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data-mpm-handover:/data
    # Thêm mật khẩu cho Redis
    command: redis-server --requirepass "SecureRedisPassword123!" --appendonly yes

  # UI để quản lý Redis (RedisInsight)
  redis-insight:
    image: redislabs/redisinsight:1.14.0
    container_name: redis-insight-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis

  elasticsearch:
    container_name: vti-elasticsearch
    image: elasticsearch:7.17.10
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - optimize-network

  logstash:
    container_name: vti-logstash
    image: logstash:7.17.10
    restart: unless-stopped
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
    volumes:
      - ./logstash/config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    networks:
      - optimize-network
    depends_on:
      - elasticsearch

  kibana:
    container_name: kb-container
    image: kibana:7.17.10
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://vti-elasticsearch:9200
    networks:
      - optimize-network
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  redis-data-mpm-handover:
  redis-insight-data:

networks:
  optimize-network:
    driver: bridge
