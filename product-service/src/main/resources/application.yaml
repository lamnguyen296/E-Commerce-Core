eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8081
  servlet:
    context-path: /ecommerce

spring:
  application:
    name: product-service
  datasource:
    url: "jdbc:mysql://localhost:3306/product_db?createDatabaseIfNotExist=true&rewriteBatchedStatements=true&useServerPrepStmts=true&characterEncoding=UTF-8"
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: product-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    admin:
      fail-fast: false
  data:
    redis:
      host: localhost
      port: 6379
      password: "SecureRedisPassword123!"
      timeout: 2000ms

logging:
  level:
    org.springframework.cache: TRACE


