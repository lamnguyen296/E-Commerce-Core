services:
  zookeeper:
    container_name: mpm-handover-zookeeper
    image: confluentinc/cp-zookeeper:7.4.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    container_name: mpm-handover-kafka
    image: confluentinc/cp-kafka:7.4.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://127.0.0.1:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-mpm-handover-10
    restart: unless-stopped
    ports:
      # Đổi cổng ngoài từ 8081 sang 8085 để không bị xung đột với product-service (port 8081)
      - "127.0.0.1:8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
      # Bật xác thực cơ bản cho Web UI
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "admin"
      SPRING_SECURITY_USER_PASSWORD: "ChangeThisPassword123!"

  redis:
    container_name: mpm-handover-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data-mpm-handover:/data
    # Thêm mật khẩu cho Redis
    command: redis-server --requirepass "SecureRedisPassword123!" --appendonly yes

  # UI để quản lý Redis (RedisInsight)
  redis-insight:
    image: redislabs/redisinsight:1.14.0
    container_name: redis-insight-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  redis-data-mpm-handover:
  redis-insight-data:
